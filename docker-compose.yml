version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: strava-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: strava-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongodb_data:
